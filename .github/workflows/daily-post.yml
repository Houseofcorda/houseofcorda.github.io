name: Daily Instagram Post

on:
  schedule:
    - cron: "30 5 * * *"      # 05:30 UTC = 11:00 AM IST / 09:30 AM Dubai. Change as you like.
  workflow_dispatch:           # lets you run it manually to test

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pillow
          if [ "$POST_MODE" = "reel" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
        env:
          POST_MODE: image     # keep the same value as in the next step

      - name: Git identity
        run: |
          git config user.name "corda-bot"
          git config user.email "corda-bot@users.noreply.github.com"

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_MODE: image     # change to "reel" for video with music
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python .github/workflows/scripts/post.py

      - name: Save posting history
        run: |
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted history" && git push)
