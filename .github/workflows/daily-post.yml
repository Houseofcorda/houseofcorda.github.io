name: Daily Instagram Post

on:
  schedule:
    # The job starts about 30 minutes early, builds the Reel, then waits and posts at the exact time.
    - cron: "27 1 * * *"       # starts 06:57 AM India  -> posts at 07:30 AM India (02:00 UTC)
    - cron: "27 10 * * *"      # starts 03:57 PM India  -> posts at 04:30 PM India (11:00 UTC)
  workflow_dispatch:            # lets you run it by hand to test (posts straight away)

permissions:
  contents: write

concurrency:
  group: instagram-post         # never run two posts at the same time
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pillow
          if [ "$POST_MODE" = "reel" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
        env:
          POST_MODE: reel

      - name: Git identity
        run: |
          git config user.name "corda-bot"
          git config user.email "corda-bot@users.noreply.github.com"

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_MODE: reel
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          POST_AT_UTC: ${{ github.event.schedule == '27 1 * * *' && '02:00' || github.event.schedule == '27 10 * * *' && '11:00' || '' }}
        run: python .github/workflows/scripts/post.py

      - name: Save posting history
        run: |
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted history" && git push)
