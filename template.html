<style>
:root{--brand:#9B1B30;--brand2:#6B0F1F;--bg:#FBF6EC;--card:#fff;--text:#2A1D1A;--muted:#7A6A55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
header{display:flex;align-items:center;gap:12px;border-bottom:3px solid #D4A63A}
.lg{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #D4A63A;flex:none}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px;color:#F6DE9A}.logo span{font-weight:400;color:#fff}
.sub{font-size:12px;opacity:.85;margin-top:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 6px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:11px 14px;border:1px solid #E6D9BE;border-radius:24px;font-size:16px;background:#fff;outline:none}
#q:focus{border-color:var(--brand)}
#s{padding:0 10px;border:1px solid #E6D9BE;border-radius:24px;font-size:14px;background:#fff;max-width:130px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;border:1px solid #E6D9BE;background:#fff;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:#D4A63A;color:#fff}
.count{padding:6px 14px;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#F1E7D2}
.info{padding:8px 10px 10px}
.name{font-size:12.5px;line-height:1.3;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-size:16px;font-weight:800;color:var(--brand);margin-top:4px}
.cat{font-size:11px;color:var(--muted)}
.more{display:block;margin:6px auto 30px;padding:12px 28px;border:0;border-radius:24px;background:var(--brand);color:#fff;font-size:15px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.wa{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:9px 6px;border:0;border-radius:8px;background:#25D366;color:#fff;font-size:13px;font-weight:700;text-decoration:none;width:100%;cursor:pointer}
.wa svg{width:16px;height:16px;fill:#fff;flex:none}
.lbwa{width:auto;padding:12px 26px;font-size:16px;border-radius:26px;margin-top:14px}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fab svg{width:30px;height:30px;fill:#fff}
.upi{border:2px solid #D4A63A;display:none;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:12px 26px;border-radius:26px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.upinote{color:#E6D9BE;font-size:12px;text-align:center;margin-top:10px;max-width:320px;line-height:1.4}
.upinote b{color:#fff;cursor:pointer;text-decoration:underline}
#lb{position:fixed;inset:0;background:rgba(30,10,12,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain}
#lb .t{color:#fff;text-align:center;margin-top:12px;font-size:15px;max-width:520px}
#lb .p{color:#fff;font-size:22px;font-weight:800;margin-top:4px}
#lb .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;color:#fff;font-size:34px;line-height:1;background:none;border:0}

function orderLink(d){var u=pageLink(d);return waLink("Hello Alva Xpress, I want to order:\n"+d[0]+"\nPrice: "+fmt(d[1])+(u?"\n"+u:"")+"\nPlease confirm availability.")}
var STEP=60,shown=STEP,cat="All",$=function(i){return document.getElementById(i)};
var cats={};D.forEach(function(d){cats[d[2]]=(cats[d[2]]||0)+1});
var names=["All"].concat(Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}));
$("chips").innerHTML=names.map(function(c){return '<button class="chip'+(c=="All"?' on':'')+'" data-c="'+c.replace(/"/g,'&quot;')+'">'+c+(c=="All"?' ('+D.length+')':' ('+cats[c]+')')+'</button>'}).join("");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function fmt(n){return "\u20b9"+n.toLocaleString("en-IN")}
var cur=[];
function render(reset){
 if(reset)shown=STEP;
 var q=$("q").value.trim().toLowerCase(),s=$("s").value;
 cur=D.map(function(d,i){return{d:d,i:i}}).filter(function(o){return(cat=="All"||o.d[2]==cat)&&(!q||(o.d[0]+" "+o.d[2]).toLowerCase().indexOf(q)>-1)});
 if(s=="l")cur.sort(function(a,b){return a.d[1]-b.d[1]});else if(s=="h")cur.sort(function(a,b){return b.d[1]-a.d[1]});
 $("count").textContent=cur.length+" products";
 var part=cur.slice(0,shown);
 $("grid").innerHTML=part.length?part.map(function(o){var d=o.d;return '<div class="card" data-i="'+o.i+'"><img loading="lazy" src="'+esc(d[3])+'" alt="'+esc(d[0])+'"><div class="info"><div class="name">'+esc(d[0])+'</div><div class="price">'+fmt(d[1])+'</div><div class="cat">'+esc(d[2])+'</div><button class="wa" data-w="'+o.i+'">'+WA+' Order on WhatsApp</button></div></div>'}).join(""):'<div class="empty" style="grid-column:1/-1">No products found</div>';
 $("more").style.display=cur.length>shown?"block":"none";
}
$("more").onclick=function(){shown+=STEP;render(false)};
$("q").oninput=function(){render(true)};$("s").onchange=function(){render(true)};
$("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;
 document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});render(true);window.scrollTo({top:0})};
$("grid").onclick=function(e){var w=e.target.closest(".wa");if(w){window.open(orderLink(D[w.dataset.w]),"_blank");return}var c=e.target.closest(".card");if(!c)return;var d=D[c.dataset.i];
 $("lbi").src=d[4]||d[3];$("lbt").textContent=d[0];$("lbp").textContent=fmt(d[1]);$("lbw").innerHTML=WA+" Order on WhatsApp";setUpi(d);$("lbw").dataset.i=c.dataset.i;$("lb").classList.add("on")};
$("lbw").onclick=function(e){e.stopPropagation();window.open(orderLink(D[this.dataset.i]),"_blank")};
$("lbu").onclick=function(e){e.stopPropagation()};
$("lbc").onclick=function(e){e.stopPropagation();try{navigator.clipboard.writeText(UPI_ID);this.textContent="Copied!";var t=this;setTimeout(function(){t.textContent=UPI_ID},1500)}catch(x){}};
$("lb").onclick=function(){$("lb").classList.remove("on");$("lbi").src=""};
$("fab").innerHTML=WA;$("fab").href=waLink("Hello Alva Xpress, I would like to know about your jewellery.");
render(true);
(function(){var m=location.hash.match(/^#p(\d+)$/);if(!m)return;for(var i=0;i<D.length;i++){if(String(D[i][5])===m[1]){var d=D[i];$("lbi").src=d[4]||d[3];$("lbt").textContent=d[0];$("lbp").textContent=fmt(d[1]);$("lbw").innerHTML=WA+" Order on WhatsApp";setUpi(d);$("lbw").dataset.i=i;$("lb").classList.add("on");break}}})();
</script></body></html>
